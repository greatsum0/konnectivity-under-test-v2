scenarios:
  - name: "test_scenario_tcp"
    output_path: "output/test_client.csv"
    network:
      protocol: "tcp"
      server_address: "127.0.0.1"
      server_port: 6060
    traffic_pattern:
      type: "constant"  # Bu alan, kullanılan trafik türünü belirler (constant, burst, random, vb.)
      duration_sec: 5   # Trafik süresi
      interval_sec: 1.0  # Trafik gönderme aralığı (saniye)
      parameters:
        rate_mbps: 1000    # Sabit trafik için hız (Mbps)
        ramp_up_time: 10  # Ramp-up trafik için artış süresi (saniye)
        ramp_down_time: 10 # Ramp-down trafik için düşüş süresi (saniye)
        amplitude: 2.5      # Sinüzoidal trafik için genlik
        frequency: 0.20   # Sinüzoidal trafik için frekans (Hz)
        random_seed: 123     # Random trafik için başlangıç seed'i
        max_rate_mbps: 50  # Random trafik için maksimum hız (Mbps)
        burst_size_mb: 80   # Burst trafik için patlama boyutu (MB)
        min_burst_size_mb: 10 # Burst trafik için minimum patlama boyutu (MB)
        max_burst_size_mb: 100 # Burst trafik için maksimum patlama boyutu (MB)
        burst_duration_sec: 2 # Burst trafik için patlama süresi (saniye)
        burst_interval_sec: 3 # Burst trafik için patlama aralığı (saniye)
        min_burst_duration_ms: 1000 # Burst trafik için minimum patlama süresi (ms)
        max_burst_duration_ms: 3000 # Burst trafik için maksimum patlama süresi (ms)
        min_burst_interval_ms: 2000 # Burst trafik için minimum patlama aralığı (ms)
        max_burst_interval_ms: 5000 # Burst trafik için maksimum patlama aralığı (ms)
    metric_collection:
      interval_sec: 1.0  # Metrik toplama aralığı (saniye)
      metrics:
        - total_cpu_util
        - tool_cpu_util
