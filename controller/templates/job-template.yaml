apiVersion: batch/v1
kind: Job
metadata:
  name: {{ name }}
  namespace: {{ namespace }}
spec:
  template:
    spec:
      nodeSelector:
        kubernetes.io/hostname: {{ node_name | default("raspberrypi-a") }}
      containers:
        - name: kut-client
          image: {{ image }}:{{ image_tag | default("latest") }}
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              /app/build/kut --mode client \
              --config /app/config/scenario.yaml
          volumeMounts:
            {% for mount in volume_mounts %}
            - name: {{ mount.name }}
              mountPath: {{ mount.mountPath }}
            {% endfor %}
      restartPolicy: Never
      volumes:
        {% for volume in volumes %}
        - name: {{ volume.name }}
          {% if volume.type == 'pvc' %}
          persistentVolumeClaim:
            claimName: {{ volume.claimName }}
          {% elif volume.type == 'emptyDir' %}
          emptyDir: {}
          {% elif volume.type == 'configMap' %}
          configMap:
            name: {{ volume.claimName }}
          {% endif %}
        {% endfor %}
      imagePullSecrets:
        - name: kut-regcred
