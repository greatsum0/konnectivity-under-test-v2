apiVersion: batch/v1
kind: Job
metadata:
  name: {{ name }}
  namespace: {{ namespace }}
spec:
  template:
    spec:
      nodeSelector:
        kubernetes.io/hostname: {{ node_name | default("raspberrypi-a") }}
      containers:
        - name: kut-client
          image: {{ image }}:{{ image_tag | default("latest") }}
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              /app/build/kut --mode client \
              --config /app/config/scenario.yaml
          volumeMounts:
            - name: client-data
              mountPath: /measurements/client
            - name: config-volume
              mountPath: /app/config
      restartPolicy: Never
      imagePullSecrets:
        - name: kut-regcred
      volumes:
        - name: client-data
          persistentVolumeClaim:
            claimName: {{ pvc_name | default("client-pvc") }}
        - name: config-volume
          configMap:
            name: {{ configmap_name }}
