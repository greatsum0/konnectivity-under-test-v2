apiVersion: v1
kind: Pod
metadata:
  name: {{ name }}
  namespace: {{ namespace }}
spec:
  nodeSelector:
    kubernetes.io/hostname: {{ node_name }}
  containers:
    - name: pvc-viewer
      image: {{ image | default("alpine:latest") }}
      command: ["/bin/sh", "-c", "while true; do sleep 3600; done"]
      volumeMounts:
        - name: pvc-volume
          mountPath: {{ mount_path | default("/mnt/data") }}
  restartPolicy: Always
  volumes:
    - name: pvc-volume
      persistentVolumeClaim:
        claimName: {{ pvc_name }}
