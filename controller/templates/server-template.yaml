apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ name }}
  namespace: {{ namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ name }}
  template:
    metadata:
      labels:
        app: {{ name }}
    spec:
      nodeSelector:
        kubernetes.io/hostname: {{ node_name | default("raspberrypi-b") }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: {{ name }}
          image: {{ image }}
          imagePullPolicy: Always
          securityContext:
            privileged: true
          command: ["/bin/sh", "-c"]
          args:
            - |
              /app/build/kut --mode server \
              --config /app/config/scenario.yaml
          ports:
            {% for port in ports %}
            - name: {{ port.name }}
              containerPort: {{ port.containerPort }}
              hostPort: {{ port.hostPort }}
            {% endfor %}
          volumeMounts:
            - name: config-volume
              mountPath: /app/config
            {% for mount in volume_mounts %}
            - name: {{ mount.name }}
              mountPath: {{ mount.mountPath }}
            {% endfor %}
      volumes:
        - name: config-volume
          configMap:
            name: {{ configmap_name }}
        {% for volume in volumes %}
        - name: {{ volume.name }}
          {% if volume.type == 'pvc' %}
          persistentVolumeClaim:
            claimName: {{ volume.claimName }}
          {% elif volume.type == 'emptyDir' %}
          emptyDir: {}
          {% endif %}
        {% endfor %}
      imagePullSecrets:
        - name: kut-regcred
