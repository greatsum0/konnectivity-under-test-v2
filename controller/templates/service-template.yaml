apiVersion: v1
kind: Service
metadata:
  name: {{ name }}
  namespace: {{ namespace }}
spec:
  selector:
    app: {{ server_name }}
  ports:
{% for port in ports %}
    - name: {{ port.name }}
      protocol: {{ port.protocol }}
      port: {{ port.port }}
      targetPort: {{ port.targetPort }}
{% endfor %}
  type: ClusterIP
