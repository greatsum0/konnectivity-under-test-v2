apiVersion: v1
kind: Pod
metadata:
  name: <pod-name>
  namespace: <namespace>
spec:
  nodeSelector:
    kubernetes.io/hostname: <node-name>
  containers:
    - name: pvc-viewer
      image: alpine:latest
      command: ["/bin/sh", "-c", "while true; do sleep 3600; done"]
      volumeMounts:
        - name: pvc-volume
          mountPath: /mnt/data
  restartPolicy: Always
  volumes:
    - name: pvc-volume
      persistentVolumeClaim:
        claimName: <pvc-name>
