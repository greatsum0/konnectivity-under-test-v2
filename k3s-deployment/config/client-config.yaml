apiVersion: v1
kind: ConfigMap
metadata:
  name: kut-client-config
  namespace: kut-app
data:
  client_configs.yaml: |
    scenarios:
      - name: "scenario_tcp_burst"
        output_path: "/measurements/data/scenario_tcp_burst.csv"
        network:
          protocol: "tcp"
          server_address: "kut-server"
          server_port: 23456
        traffic_pattern:
          type: "burst"  # This field specifies the traffic pattern type (constant, burst, random, etc.)
          duration_sec: 30  # Traffic duration
          interval_sec: 1.0  # Traffic sending interval (seconds)
          parameters:
            rate_mbps: 500
            burst_size_mb: 80   # Burst size for burst traffic (MB)
            burst_duration_sec: 2 # Duration of each burst (seconds)
            burst_interval_sec: 3 # Interval between bursts (seconds)
        metric_collection:
          interval_sec: 1.0  # Metric collection interval (seconds)
          metrics:
            - total_cpu_util
            - tool_cpu_util
            - throughput
            - total_cpu_util_norm

      - name: "test_scenario_pure_burst"
        output_path: "/measurements/data/test_scenario_pure_burst.csv"
        network:
          protocol: "tcp"
          server_address: "kut-server"
          server_port: 23456
        traffic_pattern:
          type: "pure_burst"  # This field specifies the traffic pattern type (constant, burst, random, etc.)
          duration_sec: 30   # Traffic duration
          interval_sec: 1.0  # Traffic sending interval (seconds)
          parameters:
            burst_size_mb: 80   # Burst size for burst traffic (MB)
            burst_duration_sec: 2 # Duration of each burst (seconds)
            burst_interval_sec: 3 # Interval between bursts (seconds)
        metric_collection:
          interval_sec: 1.0  # Metric collection interval (seconds)
          metrics:
            - total_cpu_util
            - tool_cpu_util
            - throughput
            - total_cpu_util_norm

      - name: "test_scenario_random_burst"
        output_path: "/measurements/data/test_scenario_random_burst.csv"
        network:
          protocol: "tcp"
          server_address: "kut-server"
          server_port: 23456
        traffic_pattern:
          type: "pure_burst"  # This field specifies the traffic pattern type (constant, burst, random, etc.)
          duration_sec: 30   # Traffic duration
          interval_sec: 1.0  # Traffic sending interval (seconds)
          parameters:
            rate_mbps: 500    # Rate for constant traffic (Mbps)
            burst_size_mb: 80   # Burst size for burst traffic (MB)
            burst_interval_sec: 3 # Interval between bursts (seconds)
            burst_duration_sec: 2 # Duration of each burst (seconds)
            random_seed: 123     # Seed value for random traffic
            min_burst_size_mb: 10 # Minimum burst size (MB)
            max_burst_size_mb: 100 # Maximum burst size (MB)
            min_burst_duration_ms: 1000 # Minimum burst duration (ms)
            max_burst_duration_ms: 300 # Maximum burst duration (ms)
            min_burst_interval_ms: 2000 # Minimum burst interval (ms)
            max_burst_interval_ms: 5000 # Maximum burst interval (ms)
        metric_collection:
          interval_sec: 1.0  # Metric collection interval (seconds)
          metrics:
            - total_cpu_util
            - tool_cpu_util
            - throughput
            - total_cpu_util_norm

      - name: "test_scenario_constant"
        output_path: "/measurements/data/test_scenario_constant.csv"
        network:
          protocol: "tcp"
          server_address: "kut-server"
          server_port: 23456
        traffic_pattern:
          type: "constant"  # This field specifies the traffic pattern type (constant, burst, random, etc.)
          duration_sec: 30   # Traffic duration
          interval_sec: 1.0  # Traffic sending interval (seconds)
          parameters:
            rate_mbps: 1000    # Rate for constant traffic (Mbps)
        metric_collection:
          interval_sec: 1.0  # Metric collection interval (seconds)
          metrics:
            - total_cpu_util
            - tool_cpu_util
            - throughput
            - total_cpu_util_norm

      - name: "test_scenario_ramp_up"
        output_path: "/measurements/data/test_scenario_ramp_up.csv"
        network:
          protocol: "tcp"
          server_address: "kut-server"
          server_port: 23456
        traffic_pattern:
          type: "ramp_up"  # This field specifies the traffic pattern type (constant, burst, random, etc.)
          duration_sec: 30   # Traffic duration
          interval_sec: 1.0  # Traffic sending interval (seconds)
          parameters:
            rate_mbps: 1000    # Rate for constant traffic (Mbps)
            ramp_up_time: 3  # Ramp-up duration (seconds)
        metric_collection:
          interval_sec: 1.0  # Metric collection interval (seconds)
          metrics:
            - total_cpu_util
            - tool_cpu_util
            - throughput
            - total_cpu_util_norm

      - name: "test_scenario_ramp_down"
        output_path: "/measurements/data/test_scenario_ramp_down.csv"
        network:
          protocol: "tcp"
          server_address: "kut-server"
          server_port: 23456
        traffic_pattern:
          type: "ramp_down"  # This field specifies the traffic pattern type (constant, burst, random, etc.)
          duration_sec: 30   # Traffic duration
          interval_sec: 1.0  # Traffic sending interval (seconds)
          parameters:
            rate_mbps: 1000    # Rate for constant traffic (Mbps)
            ramp_down_time: 3 # Ramp-down duration (seconds)
        metric_collection:
          interval_sec: 1.0  # Metric collection interval (seconds)
          metrics:
            - total_cpu_util
            - tool_cpu_util
            - throughput
            - total_cpu_util_norm

      - name: "test_scenario_sinusoidal"
        output_path: "/measurements/data/test_scenario_sinusoidal.csv"
        network:
          protocol: "tcp"
          server_address: "kut-server"
          server_port: 23456
        traffic_pattern:
          type: "sinusoidal"  # This field specifies the traffic pattern type (constant, burst, random, etc.)
          duration_sec: 30  # Traffic duration
          interval_sec: 1.0  # Traffic sending interval (seconds)
          parameters:
            rate_mbps: 800    # Rate for constant traffic (Mbps)
            amplitude: 10      # Amplitude for sinusoidal traffic
            frequency: 0.20   # Frequency for sinusoidal traffic (Hz)
        metric_collection:
          interval_sec: 1.0  # Metric collection interval (seconds)
          metrics:
            - total_cpu_util
            - tool_cpu_util
            - throughput
            - total_cpu_util_norm

      - name: "test_scenario_random"
        output_path: "/measurements/data/test_scenario_random.csv"
        network:
          protocol: "tcp"
          server_address: "kut-server"
          server_port: 23456
        traffic_pattern:
          type: "random"  # This field specifies the traffic pattern type (constant, burst, random, etc.)
          duration_sec: 30   # Traffic duration
          interval_sec: 1.0  # Traffic sending interval (seconds)
          parameters:
            random_seed: 123     # Seed value for random traffic
            max_rate_mbps: 1000  # Maximum rate for random traffic (Mbps)
        metric_collection:
          interval_sec: 1.0  # Metric collection interval (seconds)
          metrics:
            - total_cpu_util
            - tool_cpu_util
            - throughput
            - total_cpu_util_norm
