apiVersion: v1
kind: ConfigMap
metadata:
  name: kut-server-config
  namespace: kut-app
data:
  server_config.yaml: |
    server:
      name: "test_server"
      output_path: "/measurements/server"
      network:
        interface: "wlan0"  # Network interface to be used
        protocol: "tcp"
        port: 23456
      metric_collection:
        interval_sec: 1  # Metric collection resolution (seconds)
        metrics:
          - total_cpu_util
          - tool_cpu_util
          - throughput
          - bytes_transferred