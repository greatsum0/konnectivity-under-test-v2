apiVersion: v1
kind: ConfigMap
metadata:
  name: kut-server-config
  namespace: kut-app
data:
  server_config.yaml: |
    server:
      name: "test_server"
      output_path: "/measurements/data/test_server.csv"
      listeners:
        - protocol: "tcp"
          port: 23456
      metric_collection:
        interval_sec: 1
        metrics:
          - total_cpu_util
          - tool_cpu_util
          - total_cpu_util_norm
          - throughput