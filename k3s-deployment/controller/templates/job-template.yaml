apiVersion: batch/v1
kind: Job
metadata:
  name: kut-client-<scenario-name>
  namespace: kut-app
spec:
  template:
    spec:
      nodeSelector:
        kubernetes.io/hostname: raspberrypi-a
      containers:
        - name: kut-client
          image: placeholder/temp-image
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              /app/build/kut --mode client \
              --config /app/config/scenario.yaml
          volumeMounts:
            - name: client-data
              mountPath: /measurements/client
            - name: config-volume
              mountPath: /app/config
      restartPolicy: Never
      imagePullSecrets:
        - name: kut-regcred
      volumes:
        - name: client-data
          persistentVolumeClaim:
            claimName: client-pvc
        - name: config-volume
          configMap:
            name: kut-<scenario-name>-config
