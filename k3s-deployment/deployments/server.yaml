apiVersion: apps/v1
kind: Deployment
metadata:
  name: kut-server
  namespace: kut-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kut-server
  template:
    metadata:
      labels:
        app: kut-server
    spec:
      nodeSelector:
        kubernetes.io/hostname: raspberrypi-b
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet

      containers:
        - name: kut-server
          image: placeholder/temp-image
          imagePullPolicy: Always
          securityContext:
            privileged: true
          command: ["/bin/sh", "-c"]
          args:
            - /app/build/kut --mode server --config /app/config/server_config.yaml

          ports:
            - containerPort: 23456

          volumeMounts:
            - name: server-data
              mountPath: /measurements/server
            - name: config-volume
              mountPath: /app/config

      volumes:
        - name: server-data
          persistentVolumeClaim:
            claimName: server-pvc
        - name: config-volume
          configMap:
            name: kut-server-config

      imagePullSecrets:
        - name: kut-regcred
