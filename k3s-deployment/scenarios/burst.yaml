scenario:
  name: "scenario_tcp_burst"
  output_path: "/measurements/client"
  network:
    protocol: "tcp"
    server_address: "kut-service-server"
    server_port: 23456
  traffic_pattern:
    type: "burst"  # This section specifies the traffic pattern type (constant, burst, random, etc.)
    duration_sec: 60  # Traffic duration (seconds)
    interval_sec: 1.0  # Traffic sending interval (seconds)
    parameters:
      rate_mbps: 100 # Target rate for base traffic (Mbps)
      burst_size_mb: 20   # Burst size for burst traffic (MB)
      burst_duration_sec: 2 # Duration of each burst (seconds)
      burst_interval_sec: 4 # Interval between bursts (seconds)
      packet_size: 16332 # Packet size (bytes)
  metric_collection:
    interval_sec: 1.0  # Metric collection resolution (seconds)
    interface: "eth0"  # Network interface to be used
    metrics:
      - cpu_logger
      - network_logger