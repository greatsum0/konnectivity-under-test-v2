scenario:
  name: "test_scenario_constant"
  output_path: "/measurements/client"
  network:
    protocol: "tcp"
    server_address: "kut-server"
    server_port: 23456
  traffic_pattern:
    type: "constant"  # This section specifies the traffic pattern type (constant, burst, random, etc.)
    duration_sec: 60   # Traffic duration (seconds)
    interval_sec: 1  # Traffic sending interval (seconds)
    parameters:
      rate_mbps: 1000   # Target rate for constant traffic (Mbps)
      packet_size: 16332 # Packet size (bytes)
  metric_collection:
    interval_sec: 1  # Metric collection resolution (seconds)
    interface: "eth0"  # Network interface to be used
    metrics:
      - total_cpu_util
      - tool_cpu_util
      - throughput
      - bytes_transferred