scenario:
  name: "test_scenario_ramp_down"
  output_path: "/measurements/client"
  network:
    protocol: "tcp"
    server_address: "kut-server"
    server_port: 23456
  traffic_pattern:
    type: "ramp_down"  # This section specifies the traffic pattern type (constant, burst, random, etc.)
    duration_sec: 60   # Traffic duration (seconds)
    interval_sec: 1.0  # Traffic sending interval (seconds)
    parameters:
      rate_mbps: 1000    # Starting rate for ramp-down traffic. Start with a high rate and decrease it. (Mbps)
      ramp_down_time: 40 # Ramp-down duration (seconds)
      packet_size: 16332 # Packet size (bytes)
  metric_collection:
    interval_sec: 1.0  # Metric collection resolution (seconds)
    interface: "eth0"  # Network interface to be used
    metrics:
      - total_cpu_util
      - tool_cpu_util
      - network_logger