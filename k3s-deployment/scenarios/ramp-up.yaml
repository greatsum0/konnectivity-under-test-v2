scenario:
  name: "test_scenario_ramp_up"
  output_path: "/measurements/client"
  network:
    protocol: "tcp"
    server_address: "kut-server"
    server_port: 23456
  traffic_pattern:
    type: "ramp_up"  # This section specifies the traffic pattern type (constant, burst, random, etc.)
    duration_sec: 60   # Traffic duration (seconds)
    interval_sec: 1.0  # Traffic sending interval (seconds)
    parameters:
      rate_mbps: 1000    # Target rate for ramp-up traffic. Reaches to 1000 Mbps in 20 seconds. (Mbps)
      ramp_up_time: 40  # Ramp-up duration (seconds)
      packet_size: 16332 # Packet size (bytes)
  metric_collection:
    interval_sec: 1.0  # Metric collection resolution (seconds)
    interface: "eth0"  # Network interface to be used
    metrics:
      - cpu_logger
      - network_logger