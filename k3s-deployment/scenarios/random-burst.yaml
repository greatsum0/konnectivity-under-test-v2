scenario:
  name: "test_scenario_random_burst"
  output_path: "/measurements/client"
  network:
    protocol: "tcp"
    server_address: "kut-server"
    server_port: 23456
  traffic_pattern:
    type: "random_burst"  # This section specifies the traffic pattern type (constant, burst, random, etc.)
    duration_sec: 60   # Traffic duration (seconds)
    interval_sec: 1.0  # Traffic sending interval (seconds)
    parameters:
      rate_mbps: 100    # Target rate for base traffic (Mbps)
      random_seed: 123     # Seed for random number generation
      min_burst_size_mb: 5 # Minimum burst size (MB)
      max_burst_size_mb: 20 # Maximum burst size (MB)
      min_burst_duration_ms: 1000 # Minimum burst duration (ms)
      max_burst_duration_ms: 2000 # Maximum burst duration (ms)
      min_burst_interval_ms: 2000 # Minimum burst interval (ms)
      max_burst_interval_ms: 4000 # Maximum burst interval (ms)
      packet_size: 16332 # Packet size (bytes)
  metric_collection:
    interval_sec: 1.0  # Metric collection resolution (seconds)
    interface: "eth0"  # Network interface to be used
    metrics:
      - cpu_logger
      - network_logger