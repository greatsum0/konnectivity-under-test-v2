scenario:
  name: "test_scenario_random_burst"
  output_path: "/measurements/data/test_scenario_random_burst.csv"
  network:
    protocol: "tcp"
    server_address: "kut-server"
    server_port: 23456
  traffic_pattern:
    type: "random_burst"  # Bu alan, kullanılan trafik türünü belirler (constant, burst, random, vb.)
    duration_sec: 11   # Trafik süresi
    interval_sec: 1.0  # Trafik gönderme aralığı (saniye)
    parameters:
      rate_mbps: 500    # Sabit trafik için hız (Mbps)
      burst_size_mb: 200   # Burst trafik için patlama boyutu (MB)
      burst_interval_sec: 3 # Burst trafik için patlama aralığı (saniye)
      burst_duration_sec: 2 # Burst trafik için patlama süresi (saniye)
      random_seed: 123     # Random trafik için başlangıç seed'i
      min_burst_size_mb: 10 # Burst trafik için minimum patlama boyutu (MB)
      max_burst_size_mb: 200 # Burst trafik için maksimum patlama boyutu (MB)
      min_burst_duration_ms: 1000 # Burst trafik için minimum patlama süresi (ms)
      max_burst_duration_ms: 10000 # Burst trafik için maksimum patlama süresi (ms)
      min_burst_interval_ms: 2000 # Burst trafik için minimum patlama aralığı (ms)
      max_burst_interval_ms: 6000 # Burst trafik için maksimum patlama aralığı (ms)
  metric_collection:
    interval_sec: 1.0  # Metrik toplama aralığı (saniye)
    metrics:
      - total_cpu_util
      - tool_cpu_util
      - tool_cpu_util_norm
      - throughput