scenario:
  name: "test_scenario_random"
  output_path: "/measurements/data/test_scenario_random.csv"
  network:
    protocol: "tcp"
    server_address: "kut-server"
    server_port: 23456
  traffic_pattern:
    type: "random"  # Bu alan, kullanılan trafik türünü belirler (constant, burst, random, vb.)
    duration_sec: 11   # Trafik süresi
    interval_sec: 1.0  # Trafik gönderme aralığı (saniye)
    parameters:
      random_seed: 123     # Random trafik için başlangıç seed'i
      max_rate_mbps: 1000  # Random trafik için maksimum hız (Mbps)
  metric_collection:
    interval_sec: 1.0  # Metrik toplama aralığı (saniye)
    metrics:
      - total_cpu_util
      - tool_cpu_util
      - tool_cpu_util_norm
      - throughput