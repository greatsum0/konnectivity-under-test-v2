scenario:
  name: "test_scenario_sinusoidal"
  output_path: "/measurements/data"
  network:
    protocol: "tcp"
    server_address: "127.0.0.1"
    server_port: 6060
  traffic_pattern:
    type: "sinusoidal"  # This section specifies the traffic pattern type (constant, burst, random, etc.)
    duration_sec: 20  # Traffic duration (seconds)
    interval_sec: 1.0  # Traffic sending interval (seconds)
    parameters:
      rate_mbps: 80    # Mean rate for sinusoidal traffic (Mbps)
      amplitude: 80      # Amplitude for sinusoidal traffic (Mbps)
      frequency: 0.05   # Frequency for sinusoidal traffic 1 / duration (Hz)
      packet_size: 12500 # Packet size (bytes)
  metric_collection:
    interval_sec: 1.0  # Metric collection resolution (seconds)
    metrics:
      - total_cpu_util
      - tool_cpu_util
      - throughput
      - tool_cpu_util_norm