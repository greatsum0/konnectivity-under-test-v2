scenario:
  name: "test_scenario_sinusoidal"
  output_path: "/measurements/data/test_scenario_sinusoidal.csv"
  network:
    protocol: "tcp"
    server_address: "kut-server"
    server_port: 23456
  traffic_pattern:
    type: "sinusoidal"  # Bu alan, kullanılan trafik türünü belirler (constant, burst, random, vb.)
    duration_sec: 11  # Trafik süresi
    interval_sec: 1.0  # Trafik gönderme aralığı (saniye)
    parameters:
      rate_mbps: 800    # Sabit trafik için hız (Mbps)
      amplitude: 200      # Sinüzoidal trafik için genlik
      frequency: 0.09   # Sinüzoidal trafik için frekans (Hz)
  metric_collection:
    interval_sec: 1.0  # Metrik toplama aralığı (saniye)
    metrics:
      - total_cpu_util
      - tool_cpu_util
      - tool_cpu_util_norm
      - throughput