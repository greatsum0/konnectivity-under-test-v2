apiVersion: v1
kind: Service
metadata:
  name: kut-server
  namespace: kut-app
spec:
  selector:
    app: kut-server  # Deployment label
  ports:
    - name: tcp-server
      protocol: TCP
      port: 23456
      targetPort: 23456
    - name: udp-server
      protocol: UDP
      port: 23456
      targetPort: 23456
    - name: ui-server
      protocol: TCP
      port: 6070
      targetPort: 6070
  type: ClusterIP
