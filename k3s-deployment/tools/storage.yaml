apiVersion: v1
kind: Pod
metadata:
  name: pvc-viewer-client
  namespace: kut-app
spec:
  nodeSelector:
    kubernetes.io/hostname: raspberrypi-a  # client-pvc'nin bağlı olduğu node
  containers:
    - name: pvc-viewer
      image: alpine:latest
      command: ["/bin/sh", "-c", "while true; do sleep 3600; done"]
      volumeMounts:
        - name: client-volume
          mountPath: /measurements/data
  restartPolicy: Always
  volumes:
    - name: client-volume
      persistentVolumeClaim:
        claimName: client-pvc
